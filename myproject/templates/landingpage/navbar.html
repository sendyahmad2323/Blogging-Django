{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary shadow fixed-top py-3">
  <div class="container">
    <a class="navbar-brand fw-bold text-white" href="/">SEN Blog</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
      aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-center">

        <!-- Gallery -->
        <li class="nav-item me-3">
          <a class="nav-link text-white d-flex align-items-center" href="{% url 'gallery' %}">
            <i class="material-icons me-1">photo_library</i> Gallery
          </a>
        </li>

        {% if user.is_authenticated %}
        <!-- Dropdown User -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#" id="navbarDropdown" role="button"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="material-icons me-1">account_circle</i> {{ user.get_full_name|default:user.username }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/dashboard"><i class="material-icons me-1">dashboard</i> Dashboard</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="{% url 'logout' %}"><i class="material-icons me-1">logout</i> Logout</a></li>
          </ul>
        </li>
        {% else %}
        <!-- Tombol Login -->
        <li class="nav-item">
          <a href="/auth-login" class="btn btn-light btn-sm ms-2">
            <i class="material-icons me-1">login</i> Login
          </a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
