{% extends 'dashboard/base.html' %}
{% load static %}
{% block content %}
<div class="row mt-4">
  <div class="col-lg-8 col-md-10 mx-auto">
    <div class="card shadow border-radius-xl">
      <!-- Header -->
      <div class="card-header bg-gradient-dark text-white d-flex align-items-center">
        <div class="icon icon-md icon-shape text-dark shadow text-center border-radius-md me-3">
          <i class="material-icons opacity-10">category</i>
        </div>
        <h6 class="mb-0 text-white">Form Tambah Kategori</h6>
      </div>

      <!-- Form Body -->
      <div class="card-body px-4 py-4">
        <form method="POST" novalidate>
          {% csrf_token %}

          <div class="input-group input-group-outline mb-3">
            <label for="id_nama" class="form-label text-dark fw-semibold">Nama Kategori</label>
            {{ forms.nama }}
            {% if forms.nama.errors %}
              <div class="text-danger small mt-1">
                {{ forms.nama.errors.as_text }}
              </div>
            {% endif %}
          </div>

          <div class="d-flex justify-content-end mt-3">
            <a href="{% url 'admin_kategori_list' %}" class="btn btn-outline-secondary me-2">Batal</a>
            <button type="submit" class="btn btn-dark">💾 Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script src="{% static 'dashboard/assets/js/plugins/choices.min.js' %}"></script>
<script src="{% static 'dashboard/assets/js/plugins/quill.min.js' %}"></script>
<script src="{% static 'dashboard/assets/js/plugins/flatpickr.min.js' %}"></script>
<script src="{% static 'dashboard/assets/js/plugins/dropzone.min.js' %}"></script>
<script>
    if (document.getElementById('choices-multiple-remove-button')) {
        var element = document.getElementById('choices-multiple-remove-button');
        const example = new Choices(element, {
          removeItemButton: true
        });
  
        example.setChoices(
          [{
              value: 'One',
              label: 'Label One',
              disabled: true
            },
            {
              value: 'Two',
              label: 'Label Two',
              selected: true
            },
            {
              value: 'Three',
              label: 'Label Three'
            },
          ],
          'value',
          'label',
          false,
        );
      }  
    if (document.querySelector('.datetimepicker')) {
        flatpickr('.datetimepicker', {
          allowInput: true
        }); // flatpickr
    }
  </script>
{% endblock %}
