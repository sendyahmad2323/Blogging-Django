{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="en" itemscope itemtype="http://schema.org/WebPage">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="apple-touch-icon" sizes="76x76" href="{% static 'landingpage/assets/img/apple-icon.png' %}" />
    <link rel="icon" type="image/png" href="{% static 'dashboard/assets/img/download.png' %}" />
    <title>My Blog Login</title>
    <!-- Fonts and icons -->
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900|Roboto+Slab:400,700" />
    <!-- Nucleo Icons -->
    <link href="{% static 'landingpage/assets/css/nucleo-icons.css' %}" rel="stylesheet" />
    <link href="{% static 'landingpage/assets/css/nucleo-svg.css' %} " rel="stylesheet" />
    <!-- Tambahan untuk Login dengan Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <!-- Tambahkan ini di base.html atau di halaman terkait -->
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <!-- CSS Files -->
    <link id="pagestyle" href="{% static 'landingpage/assets/css/material-kit-pro.css' %}?v=3.0.0" rel="stylesheet" />
  </head>

  <body class="sign-in-cover bg-gray-200">
    <!-- Navbar -->
    <div class="container position-sticky z-index-sticky top-0">
      <div class="row">
        <div class="col-12">
          <nav class="navbar navbar-expand-lg navbar navbar-expand-lg position-absolute top-0 z-index-3 shadow-none my-3 navbar-transparent mt-4 my-3 py-2 start-0 end-0 mx-4">
            <div class="container-fluid px-0">
              <div class="collapse navbar-collapse w-100 pt-3 pb-2 py-lg-0" id="navigation">
                <ul class="navbar-nav navbar-nav-hover ms-auto"></ul>
                <ul class="navbar-nav d-lg-block d-none">
                  <li class="nav-item">
                    <a href="/" class="btn btn-sm btn-white mb-0" onclick="smoothToPricing('pricing-soft-ui')">Home</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
          <!-- End Navbar -->
        </div>
      </div>
    </div>
    <div class="page-header align-items-start min-height-300 m-3 border-radius-xl" style="background-image: url('https://images.unsplash.com/photo-1491466424936-e304919aada7?ixlib=rb-1.2.1&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1949&q=80');" loading="lazy">
      <span class="mask bg-gradient-dark opacity-6"></span>
    </div>
    <div class="container mb-4">
      <div class="row mt-lg-n12 mt-md-n12 mt-n12 justify-content-center">
        <div class="col-xl-4 col-lg-5 col-md-7 mx-auto">
          <div class="card mt-8">
            <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
              <div class="bg-gradient-success shadow-success border-radius-lg py-3 pe-1 text-center py-4">
                <h4 class="font-weight-bolder text-white mt-1">Sign In</h4>
                <p class="mb-1 text-sm text-white">{{ pesan }}</p>
              </div>
            </div>
            <div class="card-body">
              <form role="form" method="POST" class="text-start">
                {% csrf_token %}
                <div class="input-group input-group-static mb-4">
                  <label>Usename</label>
                  <input type="name" name="username" class="form-control" placeholder="username anda" required />
                </div>
                <div class="input-group input-group-static mb-4">
                  <label>Password</label>
                  <input type="password" name="password" class="form-control" placeholder="•••••••••••••" required />
                </div>
                <div class="form-check form-switch d-flex align-items-center mb-3">
                  <input class="form-check-input" type="checkbox" id="rememberMe" checked="" />
                  <label class="form-check-label mb-0 ms-3" for="rememberMe">Remember me</label>
                </div>
                <div class="text-center">
                  <button type="submit" class="btn bg-gradient-dark w-100 mt-3 mb-0">Login</button>
                </div>
              </form>
            </div>
            <div class="card-footer text-center pt-0 px-lg-2 px-1">
              <div class="text-center mt-3">
                <a href="{% provider_login_url 'google' %}" class="btn d-flex justify-content-center align-items-center" style="
                background-color: #fff;
                color: #555;
                border: 1px solid #ddd;
                font-weight: 500;
                padding: 0.5rem 1rem;
                border-radius: 6px;
                text-decoration: none;
                transition: box-shadow 0.2s ease, background-color 0.2s ease;">
                  <svg viewBox="0 0 48 48" width="20" height="20" class="me-2">
                    <path fill="#4285F4" d="M24 9.5c3.3 0 5.7 1.4 7.3 2.5l5.3-5.3C33.3 3.5 29.3 2 24 2 15.3 2 7.9 6.9 4.3 14.1l6.2 4.8C12.2 13.4 17.5 9.5 24 9.5z"></path>
                    <path fill="#34A853" d="M46 24c0-1.6-.1-3.1-.4-4.5H24v9h12.3c-.5 2.7-2.1 5-4.3 6.5l6.2 4.8C43.1 35.3 46 30.1 46 24z"></path>
                    <path fill="#FBBC04" d="M10.5 28.5c-1.1-2.2-1.7-4.5-1.7-6.9s.6-4.7 1.7-6.9L4.3 9.9C2.8 12.9 2 16.3 2 20s.8 7.1 2.3 10.1l6.2-4.8z"></path>
                    <path fill="#EA4335" d="M24 46c5.3 0 9.8-1.8 13.1-4.9l-6.2-4.8c-1.7 1.1-3.9 1.8-6.9 1.8-5.1 0-9.4-3.4-11-8.1l-6.2 4.8C9.9 41.1 16.3 46 24 46z"></path>
                  </svg>Login dengan Google
                </a>
              </div>

              <style>
                /* Efek hover untuk memberi kesan interaktif */
                a.btn:hover {
                  background-color: #f8f9fa;
                  box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
                }
              </style>

              <p class="mb-4 text-sm mx-auto">
                belum punya akun?
                <a href="/auth-registrasi" class="text-success text-gradient font-weight-bold">Registrasi</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Core JS Files -->
    <script src="{% static 'landingpage/assets/js/core/popper.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'landingpage/assets/js/core/bootstrap.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'landingpage/assets/js/plugins/perfect-scrollbar.min.js' %}"></script>
    <!-- Plugin for TypedJS, full documentation here: https://github.com/mattboldt/typed.js/ -->
    <script src="{% static 'landingpage/assets/js/plugins/typedjs.js' %}"></script>
    <!-- Plugin for Parallax, full documentation here: https://github.com/wagerfield/parallax -->
    <script src="{% static 'landingpage/assets/js/plugins/parallax.min.js' %}"></script>
    <!-- Plugin for the Sliders, full documentation here: http://refreshless.com/nouislider/ -->
    <script src="{% static 'landingpage/assets/js/plugins/nouislider.min.js' %}" type="text/javascript"></script>
    <!-- Plugin for the blob animation -->
    <script src="{% static 'landingpage/assets/js/plugins/anime.min.js' %}" type="text/javascript"></script>
    <!-- Control Center for Material UI Kit: parallax effects, scripts for the example pages etc -->
    <!-- Google Maps Plugin -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDTTfWur0PDbZWPr7Pmq8K3jiDp0_xUziI"></script>
    <script src="{% static 'landingpage/assets/js/material-kit-pro.min.js' %}?v=3.0.0" type="text/javascript"></script>
  </body>
</html>
